[project]
name = "my-first-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.32.0",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
my-first-chatbot = "my_first_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps",
    "apps/chatbot_ui",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
]
